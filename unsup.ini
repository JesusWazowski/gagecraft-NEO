[unsup]
manifest = https://jesuswazowski.github.io/gagecraft-NEO/pack.toml

# Default fallback flavor if none is selected
flavor = optimizations-with-dh

# -----------------------------------------------------------------
# 1. BAREBONES: Vanilla progression, voice chat, and required dependencies
# -----------------------------------------------------------------
[flavor.barebones]
# Exclude heavy optimizations, graphics, and technical tools by default
exclude = mods/c2me-fabric.pw.toml,
          mods/carpet.pw.toml,
          mods/distant-horizons-seedgen.pw.toml,
          mods/distanthorizons.pw.toml,
          mods/ferrite-core.pw.toml,
          mods/immediatelyfast.pw.toml,
          mods/iris.pw.toml,
          mods/krypton.pw.toml,
          mods/lambdynamiclights.pw.toml,
          mods/lithium.pw.toml,
          mods/malilib.pw.toml,
          mods/sodium.pw.toml,
          mods/tweakeroo.pw.toml

# -----------------------------------------------------------------
# 2. OPTIMIZATIONS: Everything except carpet, tweakeroo, and distant horizons
# -----------------------------------------------------------------
[flavor.optimizations]
exclude = mods/carpet.pw.toml,
          mods/distant-horizons-seedgen.pw.toml,
          mods/distanthorizons.pw.toml,
          mods/tweakeroo.pw.toml,
          mods/malilib.pw.toml

# -----------------------------------------------------------------
# 3. OPTIMIZATIONS WITH DH: Optimizations + Distant Horizons
# -----------------------------------------------------------------
[flavor.optimizations-with-dh]
exclude = mods/carpet.pw.toml,
          mods/tweakeroo.pw.toml,
          mods/malilib.pw.toml

# -----------------------------------------------------------------
# 4. TECHNICAL: Includes everything (Full pack)
# -----------------------------------------------------------------
[flavor.technical]
# No exclusions needed, pulls everything marked for client/both sides.